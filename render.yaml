# Render Blueprint: sitio estático de la landing del webinar.
# Solo se publican index.html y assets/ (Code.gs y LEEME.md no quedan expuestos).
services:
  - type: web
    name: webinar-odus-dentalink
    runtime: static
    buildCommand: mkdir -p dist && cp -R index.html assets dist/
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
